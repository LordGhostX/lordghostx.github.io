<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Solomon Esenyi — social preview artwork</title>
    <style>
      @font-face {
        font-family: "Space Grotesk";
        src: url("../assets/fonts/space-grotesk-latin.woff2");
        font-weight: 400 700;
      }
      * {
        box-sizing: border-box;
      }
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        padding: 60px 70px;
        color: #eeeee5;
        background: #141511;
        font-family: "Space Grotesk", sans-serif;
      }
      header {
        display: flex;
        justify-content: space-between;
        padding-bottom: 28px;
        border-bottom: 1px solid #383c30;
        font-size: 18px;
      }
      header span {
        color: #a7aa9e;
        font-size: 15px;
      }
      h1 {
        font-size: 80px;
        line-height: 1.1;
        letter-spacing: -4px;
        margin: 48px 0 32px;
        font-weight: 500;
      }
      em {
        font-family: Georgia, serif;
        font-weight: 400;
        color: #d0ed80;
      }
      p {
        color: #a7aa9e;
        font-size: 18px;
      }
      .mark {
        position: absolute;
        right: 85px;
        top: 210px;
        font-size: 200px;
        color: #d0ed80;
        font-family: Georgia, serif;
        line-height: 1;
      }
    </style>
  </head>
  <body>
    <header>Solomon Esenyi <span>lordghostx.github.io</span></header>
    <h1>I build systems.<br />Then make them<br /><em>make sense.</em></h1>
    <span class="mark" aria-hidden="true">✳</span>
    <p>Software engineering · Technical writing · Developer infrastructure</p>
  </body>
</html>
